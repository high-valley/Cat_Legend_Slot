name: Deploy web build to GitHub Pages

on:
  push:
    branches: [claude/new-session-6t1znl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx jest --ci

      - name: Build web app for /<repo>/
        run: npm run build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      # GitHub Pages serves 404.html for unknown paths, so reloading /<repo>/battle still boots the app.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
